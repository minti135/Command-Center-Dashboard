<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Command Center</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #1a1f26;
            --accent-blue: #00d4ff;
            --text-color: #e0e0e0;
            --border-color: #30363d;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Grid Layout: Left (300px) | Middle (Flexible) | Right (350px) */
        .dashboard-container {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            z-index: 1000; /* Keeps header above map */
        }

        /* Left Section: Smart Lighting */
        .lighting-list {
            padding: 15px;
            overflow-y: auto;
        }
        .pole-card {
            background: #252b33;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .pole-card:hover {
            background: #303842;
            border-left: 3px solid var(--accent-blue);
        }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #4caf50;
            border-radius: 50%;
        }

        /* Middle Section: GIS Map */
        #map {
            flex-grow: 1;
            width: 100%;
            background: #000; /* Fallback */
        }

        /* Right Section: CCTV */
        .cctv-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
        }
        .cctv-feed {
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            position: relative;
        }
        .cctv-label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            font-size: 10px;
            color: #fff;
        }
        .rec-dot {
            position: absolute;
            top: 5px;
            right: 5px;
            color: #ff4d4d;
            font-size: 10px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Customizing Leaflet Tooltips for Dark Mode */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: var(--panel-bg);
            color: white;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <aside class="panel">
        <div class="panel-header">Smart Poles</div>
        <div class="lighting-list">
            <div class="pole-card" onclick="focusPole([40.7128, -74.0060])">
                <div>Pole #001 <br><small>Broadway St.</small></div>
                <div class="status-dot"></div>
            </div>
            <div class="pole-card" onclick="focusPole([40.7150, -74.0090])">
                <div>Pole #002 <br><small>Wall St.</small></div>
                <div class="status-dot"></div>
            </div>
            <div class="pole-card" onclick="focusPole([40.7180, -74.0020])">
                <div>Pole #003 <br><small>Park Row</small></div>
                <div style="background-color: #ff9800" class="status-dot"></div>
            </div>
        </div>
    </aside>

    <main class="panel">
        <div class="panel-header">GIS Command View</div>
        <div id="map"></div>
    </main>

    <aside class="panel">
        <div class="panel-header">CCTV Feeds</div>
        <div class="cctv-grid">
            <div class="cctv-feed">
                <span class="cctv-label">CAM 01 - NORTH ENTRY</span>
                <span class="rec-dot">● REC</span>
            </div>
            <div class="cctv-feed">
                <span class="cctv-label">CAM 02 - PERIMETER</span>
            </div>
            <div class="cctv-feed">
                <span class="cctv-label">CAM 03 - PARKING</span>
                <span class="rec-dot">● REC</span>
            </div>
            <div class="cctv-feed">
                <span class="cctv-label">CAM 04 - LOBBY</span>
            </div>
        </div>
    </aside>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Initialize the map (Centered on New York as an example)
    const map = L.map('map').setView([40.7128, -74.0060], 15);

    // 2. Add Dark Mode Map Tiles (Using CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // 3. Add Smart Pole Markers
    const pole1 = L.marker([40.7128, -74.0060]).addTo(map)
        .bindPopup('<b>Smart Pole #001</b><br>Lighting: 80% Power');

    const pole2 = L.marker([40.7150, -74.0090]).addTo(map)
        .bindPopup('<b>Smart Pole #002</b><br>Lighting: 100% Power');

    const pole3 = L.marker([40.7180, -74.0020]).addTo(map)
        .bindPopup('<b>Smart Pole #003</b><br>Status: Warning - Hardware Error');

    // 4. Function to move map when clicking the list items
    function focusPole(coords) {
        map.flyTo(coords, 17, {
            animate: true,
            duration: 1.5
        });
    }
</script>

</body>
</html>
